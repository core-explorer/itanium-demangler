<!doctype html>
<html lang="en-us">

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href='./favicon.svg' rel='icon' type='image/svg+xml'>
    <link href='./favicon.svg' rel='shortcut icon' type='image/svg+xml'>

    <title>C++ Itanium ABI Demangler</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="header" class="header">

        <span style="font-weight:500">C++ Itanium ABI Demangler</span>
        <span class="right"> <span class="version" id="version" style="visibility:hidden">v0</span> &nbsp; <a href="./grammar.html">Grammar</a>&nbsp; <span id="source-span" style="visibility:hidden">View on&nbsp;<a class="usual" id="source-link" href=".">GitHub</a></span></span>
    </div>
    <div id="main">
        <div id="mangledDiv">
            <form class="mangling_form" id="mangling_form">
                <label for="mangled">mangled name:</label>

                <input type="text" maxLength="1000" size="80" style="width:80%" id="mangled" name="mangled">
            </form>
        </div>
        <div id="demangledDiv">
            <div id="demangled" name="demangled" style="
  resize: both;
  overflow: auto;
  width: 400px;
  height: 200px;
  border: 1px solid #ccc;
  padding: 10px;
  white-space: pre-wrap;
  word-break: break-word;
">
            </div>
        </div>
        <div>
  

            <form id="option_form">          <fieldset>
  <legend>Options</legend>
  <p><input type="checkbox" id="relative" name="relative" checked /><label for="relative">Relative Names</label></p>
  <p><input type="checkbox" id="template_param" name="template_param" checked /><label for="template_param">Resolve Template Parameters</label></p>
  <p><input type="checkbox" id="substitution" name="substitution" checked /><label for="substitution">Resolve Substitutions</label></p>
  <p><input type="checkbox" id="expression" name="expression" checked /><label for="expression">Resolve Expressions</label></p>
  <p><input type="checkbox" id="function_sig" name="function_sig" checked /><label for="function_sig">Resolve Function Signatures</label></p>
  <p><input type="checkbox" id="detail" name="detail" checked /><label for="detail">Hide Technical Details</label></p>
            
<p><select name="dialect" id="dialect">
  <option value="LLVM">LLVM</option>
  <option value="GNU">GNU</option>
</select><label for="dialect">Demangling Dialect</label></p>
<p><select name="return_type" id="return_type">
  <option value="leading">leading</option>
    <option value="trailing">trailing</option>
  <option value="hide">hide</option>
</select><label for="return_type">Return Type</label></p>
</fieldset></form>
        </div>

        <script>
            var is_emscripten_initialized = 0;
            var pending_demangle = null;
            var darkmode = 0;
            document.addEventListener('DOMContentLoaded', (event) => {
                if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                    document.body.classList.add('darkmode');
                    darkmode = 1;
                } else {
                    document.body.classList.remove('darkmode');
                    darkmode = 0;
                }
                if (is_emscripten_initialized == 1) {
                    set_darkmode(darkmode);
                }
                window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', event => {
                    if (event.matches) {
                        document.body.classList.add('darkmode');
                        darkmode = 1;
                    } else {
                        document.body.classList.remove('darkmode');
                        darkmode = 0;
                    }
                    if (is_emscripten_initialized == 1) {
                        set_darkmode(darkmode);
                    }
                });

                window.addEventListener('load', function() {
                    let mangling_form = document.getElementById('mangling_form');
                    mangling_form.reset();
                    document.getElementById('option_form').reset();
                    document.getElementById('demangled').value = '';

                });
                const urlParams = new URLSearchParams(window.location.search);
                const mangled = urlParams.get('mangled');

                const container = document.getElementById('main');
                const resizableBox = document.getElementById('demangled');

                function setInitialSize() {
                    const parentWidth = container.clientWidth;
                    const parentHeight = container.clientHeight;

                    resizableBox.style.width = (parentWidth * 0.8) + 'px';
                    resizableBox.style.height = (parentHeight * 0.5) + 'px';
                }

                setInitialSize();

                if (mangled) {
                    if (is_emscripten_initialized == 1) {
                        document.getElementById('mangled').value = mangled;
                        demangle_text(mangled);
                    } else {
                        pending_demangle = mangled;
                    }

                }

            });

            function set_darkmode(darkmode_value) {
                if (is_emscripten_initialized == 1) {
                    Module.setDarkMode(darkmode_value);
                }
            }

            function demangle_text(mangled) {
                console.log("demangle_text", mangled);
                const mangledLength = lengthBytesUTF8(mangled) + 1;
                const mangledPtr = _malloc(mangledLength);
                stringToUTF8(mangled, mangledPtr, mangledLength);

                Module.demangleText(mangledPtr, mangledLength - 1);
                _free(mangledPtr);

            }

            const textarea = document.getElementById('demangled');
            const display = document.getElementById('dimension-display');

            function demangle() {
                demangle_text(document.getElementById('mangled').value);
            }
            function set_dialect() {
                let value = document.getElementById('dialect').value;
                if (value == "GNU") {
                    Module.setCompilerDialect(1);
                }
                if (value == "LLVM") {
                    Module.setCompilerDialect(2);
                }
                demangle();
            }
            function set_hide_details() {
                let value = document.getElementById('detail').checked;
                Module.setHideDetails(value);
                demangle();
            }
            function set_relative_names() {
                let value = document.getElementById('relative').checked;
                Module.setRelativeNames(value);
                demangle();
            }
            function set_return_style() {
                let value = document.getElementById('return_type').value;
                if (value == "hide"){Module.setHideReturn(1);}
                if (value == "trailing"){Module.setHideReturn(0);Module.setTrailingReturn(1);}
                if (value == "leading"){Module.setHideReturn(0);Module.setTrailingReturn(0);}
                demangle();
            }
            function set_resolve_templates() {
                let value = document.getElementById('template_param').checked;
                Module.setResolveTemplates(value);
                demangle();
            }
            function set_resolve_substitutions() {
                let value = document.getElementById('substitution').checked;
                Module.setResolveSubstitutions(value);
                demangle();
            }
            function set_resolve_expressions() {
                let value = document.getElementById('expression').checked;
                Module.setResolveExpressions(value);
                demangle();
            }
            document.getElementById('mangled').addEventListener("input", demangle);
            document.getElementById('dialect').addEventListener("input", set_dialect);
            document.getElementById('detail').addEventListener("input", set_hide_details);
            document.getElementById('return_type').addEventListener("input", set_return_style);
            document.getElementById('template_param').addEventListener("input", set_resolve_templates);
            document.getElementById('substitution').addEventListener("input", set_resolve_substitutions);
            document.getElementById('expression').addEventListener("input", set_resolve_expressions);
            document.getElementById('relative').addEventListener("input", set_relative_names);

    const container = document.getElementById('demangled');
    

    function calculateAndFillGrid() {
      // 1. Measure a single character's dimensions dynamically
      const measureSpan = document.createElement('span');
      const computed = window.getComputedStyle(container);
      
      measureSpan.style.fontFamily = computed.fontFamily;
      measureSpan.style.fontSize = computed.fontSize;
      measureSpan.style.lineHeight = computed.lineHeight;
      measureSpan.style.visibility = 'hidden';
      measureSpan.style.position = 'absolute';
      measureSpan.style.whiteSpace = 'pre';
      measureSpan.innerHTML = '<pre>#</pre>';
      
      document.body.appendChild(measureSpan);
      const charWidth = measureSpan.getBoundingClientRect().width;
      const charHeight = measureSpan.getBoundingClientRect().height;
      document.body.removeChild(measureSpan);

      // 2. Account for container padding
      const paddingX = parseFloat(computed.paddingLeft) + parseFloat(computed.paddingRight);
      const paddingY = parseFloat(computed.paddingTop) + parseFloat(computed.paddingBottom);

      const availableWidth = container.clientWidth - paddingX;
      const availableHeight = container.clientHeight - paddingY;

      // 3. Compute maximum rows and columns that fit without overflowing
      const columns = Math.floor(availableWidth / charWidth);
      const rows = Math.floor(availableHeight / charHeight);

      if (columns <= 0 || rows <= 0) {
        container.textContent = '';
        return;
      }
      
 if (is_emscripten_initialized == 1) {
                       Module.setMaxLength(columns, rows);
                        demangle_text(document.getElementById('mangled').value); 
                        
                    }


    }

    // Use ResizeObserver to automatically adjust when user resizes the div
    const resizeObserver = new ResizeObserver(() => {
      calculateAndFillGrid();
    });

    resizeObserver.observe(container);

    // Initial render
    calculateAndFillGrid();
  </script>

</body>

</html>
