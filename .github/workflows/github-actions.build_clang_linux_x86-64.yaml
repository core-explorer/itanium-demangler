name: Test building
run-name: test building clang
on: [push]
jobs:
  Github-Actions-Build-Clang:
    runs-on: ubuntu-26.04
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
      - name: Compile with clang
        run: |
          cd ${{ github.workspace }}
          sudo apt-get install libc++-dev
          ./compile.sh -c -d
      - name: test against llvm-demangler
        run: |
          cd ${{ github.workspace }}
          readelf --wide -s ./target/x86_64-Debug-clang/itanium-demangle | grep -v Ut_C2 | ./target/x86_64-Debug-clang/itanium-demangle --check
      - run: echo "job status ${{ job.status }}."
